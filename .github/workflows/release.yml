# Builds the apps on GitHub's machines and, for a version tag (v0.1.0…), publishes them in a GitHub Release.
#
# - Windows and Linux: the Tauri app (desktop/tauri), as .msi / .exe and .deb / .rpm / .AppImage.
# - macOS (Apple silicon): the SwiftUI app (desktop/ONADesktop). For a version tag with the App Store Connect key set,
#   signed with Developer ID and notarized; otherwise ad-hoc signed (the person must allow it in macOS settings).
# - iPhone: built and tested; sent to TestFlight for a version tag when the App Store Connect key is set.
#
# Pull requests that touch the apps build them too (without publishing), so a broken build shows before release.
# Secrets and how to release: docs/RELEASE.md. Actions are pinned to a commit, tools to an exact version.
name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "desktop/**"
      - "ios/**"
      - "crates/ona-core/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  tauri:
    name: Tauri app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Linux libraries for the web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Tauri CLI ${{ env.TAURI_CLI_VERSION }}
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Tests
        working-directory: desktop/tauri/src-tauri
        run: cargo test --locked

      # The core the app embeds, with its own tests, on this system too (file handling differs on Windows).
      - name: Core tests
        run: cargo test -p ona-core --locked

      - name: Build and bundle
        working-directory: desktop/tauri/src-tauri
        run: cargo tauri build --ci -- --locked

      # Starts the built app for real, with a screen (Xvfb on Linux), and checks that it is still running after a minute,
      # with its data folder created. On Linux, tor is installed from Ubuntu, so the app starts it in its default Tor
      # mode and the step waits up to 4 more minutes for the onion address. A screenshot of the screen is kept.
      - name: Linux tools for the launch
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb imagemagick tor

      - name: Launch the app
        run: |
          set -u
          mkdir -p launch
          if [ "$RUNNER_OS" = Windows ]; then
            app=desktop/tauri/src-tauri/target/release/ona-desktop.exe
            data="$(cygpath -u "$APPDATA")/org.ona.desktop"
            "$app" > launch/app.log 2>&1 &
          else
            app=desktop/tauri/src-tauri/target/release/ona-desktop
            data="$HOME/.local/share/org.ona.desktop"
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            "$app" > launch/app.log 2>&1 &
          fi
          pid=$!
          sleep 60
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "the app stopped"; cat launch/app.log; exit 1
          fi
          test -d "$data" || { echo "no data folder at $data"; exit 1; }
          if [ "$RUNNER_OS" = Linux ]; then
            for _ in $(seq 48); do
              [ -s "$data/tor/hs/hostname" ] && break
              sleep 5
            done
            if [ -s "$data/tor/hs/hostname" ]; then echo "onion address published"; else echo "no onion address after 5 minutes"; fi
            import -window root launch/screen.png
          else
            powershell -NoProfile -Command '
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("launch\screen.png")'
          fi
          echo "data folder:"; ls -R "$data" | grep -v -e '\.auth' -e 'key' | head -40
          kill "$pid" 2>/dev/null || true
          sleep 2
          cat launch/app.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: launch-${{ matrix.name }}
          path: launch/screen.png
          if-no-files-found: warn

      - name: Collect the installers
        run: |
          mkdir -p dist
          bundle=desktop/tauri/src-tauri/target/release/bundle
          find "$bundle" -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: Mac app
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: ona-core bridge
        run: desktop/OnaCoreBridge/build.sh

      - name: Tests
        working-directory: desktop/ONADesktop
        run: swift test

      # Developer ID: the certificate is made once by the team's Account Holder and stored as a .p12 secret (Apple does not
      # let an App Store Connect key create one). It goes into a temporary keychain deleted at the end of the job.
      - name: Build (Developer ID, notarized)
        if: env.MACOS_CERT_P12_BASE64 != '' && env.ASC_KEY_ID != '' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/ONADesktop
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$identity" || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          team="$(printf '%s' "$identity" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')"
          # Hardened runtime is on for Release (project settings); --timestamp is required by notarization.
          xcodebuild archive -project ONADesktop.xcodeproj -scheme ONADesktop -configuration Release \
            -archivePath "$RUNNER_TEMP/ONA.xcarchive" \
            DEVELOPMENT_TEAM="$team" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$identity" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $keychain"
          app="$RUNNER_TEMP/ONA.xcarchive/Products/Applications/ONA.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/key.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ONA.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ONA.zip" --key "$RUNNER_TEMP/asc/key.p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$app"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/dist/ONA-macOS-arm64.zip"
          security delete-keychain "$keychain"

      - name: Build (ad-hoc signed; pull requests, or no Developer ID certificate)
        if: env.MACOS_CERT_P12_BASE64 == '' || env.ASC_KEY_ID == '' || !startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/ONADesktop
        run: |
          xcodebuild archive -project ONADesktop.xcodeproj -scheme ONADesktop -configuration Release \
            -archivePath "$RUNNER_TEMP/ONA.xcarchive"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent "$RUNNER_TEMP/ONA.xcarchive/Products/Applications/ONA.app" \
            "$GITHUB_WORKSPACE/dist/ONA-macOS-arm64-unsigned.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: dist/*
          if-no-files-found: error

  ios:
    name: iPhone app
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }} with the iOS targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default "$RUST_VERSION"

      - name: Arti (Tor) for the app
        run: ios/ArtiBridge/build-xcframework.sh

      - name: Tests
        working-directory: ios/ONA
        run: swift test

      - name: Build for the simulator
        working-directory: ios/ONA
        run: |
          xcodebuild build -project ONA.xcodeproj -scheme ONA -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Send to TestFlight
        if: env.ASC_KEY_ID != '' && startsWith(github.ref, 'refs/tags/v')
        working-directory: ios/ONA
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/key.p8"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          version="${GITHUB_REF_NAME#v}"
          xcodebuild archive -project ONA.xcodeproj -scheme ONA -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ONA.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ONA.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" "${auth[@]}"

  release:
    name: GitHub Release
    # Published with what was built: a Mac failure (signing, notarization) does not hold back Windows and Linux.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.tauri.result == 'success'
    needs: [tauri, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ONA $GITHUB_REF_NAME" \
            --notes "Prototype, not audited. The model, the web and the payments are still simulated (mode: mock). The desktop apps need tor installed for the Tor mode. See docs/RELEASE.md."
