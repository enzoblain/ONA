[package]
name = "ona-pool"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test build only (a local node, testnet): the admin delay may be as short as one minute instead of 7 days. Its code
# hash differs from the normal build, and `get_config` shows the admin delay the pool was created with.
short-admin-delay = []

[dependencies]
near-sdk = { version = "5.30", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["legacy", "unit-testing"] }
ona-token = { path = "../ona-token" }
ona-wallet = { path = "../ona-wallet" }
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde_json = "=1.0.154"
