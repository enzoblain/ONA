[package]
name = "ona-pool"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["legacy", "unit-testing"] }
ona-token = { path = "../ona-token" }
ona-wallet = { path = "../ona-wallet" }
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde_json = "=1.0.154"
