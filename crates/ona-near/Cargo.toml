[package]
name = "ona-near"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[features]
# Exposes `ona_near::testing`, a local stand-in for a NEAR node, to the tests of other crates.
testing = []

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = "=2.2.0"
libc = "=0.2.191"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
zeroize = "=1.9.1"
