[package]
name = "ona-core"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "ona_core"

[[bin]]
name = "ona"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
