[package]
name = "ona-core"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "ona_core"

[[bin]]
name = "ona"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core", "hazmat"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1"
unicode-normalization = "=0.1.26"
base64 = "0.22"
ona-near = { path = "../ona-near" }
ona-token = { path = "../ona-token" }
ona-wallet = { path = "../ona-wallet" }

[dev-dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
