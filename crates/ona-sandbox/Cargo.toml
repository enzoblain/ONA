[package]
name = "ona-sandbox"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
ona-token = { path = "../ona-token" }
ona-near = { path = "../ona-near" }
ona-signer = { path = "../ona-signer" }
ona-server = { path = "../ona-server" }
near-sandbox = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
anyhow = "1"
