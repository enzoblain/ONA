[package]
name = "ona-core-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "C ABI around ona-core, linked into the ONA macOS app"

# Not a member of the root workspace: built on its own for the Mac app. Cargo.lock was seeded from the root one so
# ona-core's dependencies resolve to the same versions.
[workspace]

[lib]
# "lib" lets the tests call the bridge; build.sh builds the staticlib alone.
crate-type = ["staticlib", "lib"]

[dependencies]
ona-core = { path = "../../crates/ona-core" }
serde_json = "=1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

# Proc macros and build scripts run on this Mac while building: not stripped. The strip of Xcode 27 (beta) leaves
# their dylibs unloadable ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = "none"
